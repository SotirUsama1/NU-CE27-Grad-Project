# Same controllers as controllers.yaml, for the second MiR. Wheel joints carry the light_ prefix.
# Joint states stay on this robot's own topic so they do not mix with /joint_states.
# Odometry tf is off so the two bases do not both publish odom -> base_footprint.
/mir_light/controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    joint_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/mir_light/joint_broadcaster:
  ros__parameters:
    use_local_topics: true

/mir_light/diff_cont:
  ros__parameters:
    left_wheel_names: ["light_left_wheel_joint"]
    right_wheel_names: ["light_right_wheel_joint"]
    publish_rate: 41.2
    pose_covariance_diagonal: [0.00001, 0.00001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    twist_covariance_diagonal: [0.1, 0.1, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    enable_odom_tf: false
    wheel_separation: 0.445208
    wheel_radius: 0.100
    wheel_separation_multiplier: 1.0
    wheel_radius_multiplier: 1.0
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    base_frame_id: light_base_footprint
    odom_frame_id: light_odom
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: true
        max_acceleration: 2.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.5
        has_acceleration_limits: true
        max_acceleration: 2.5

/mir_light/joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur_shoulder_pan_joint
      - ur_shoulder_lift_joint
      - ur_elbow_joint
      - ur_wrist_1_joint
      - ur_wrist_2_joint
      - ur_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      ur_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      ur_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      ur_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      ur_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      ur_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      ur_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }
