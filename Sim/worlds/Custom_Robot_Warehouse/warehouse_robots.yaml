# Warehouse robots (generated by Sim/tools/build_warehouse_robots.py). World frame: "map".
robots:
  picker_1: {type: picker, start: {x: 2.460, y: -1.148, yaw: 0.000}}
  picker_2: {type: picker, start: {x: 21.262, y: 2.552, yaw: 1.571}}
  transport_1: {type: transport, start: {x: -3.740, y: 24.355, yaw: 1.571}}
  transport_2: {type: transport, start: {x: -3.740, y: 26.555, yaw: 1.571}}
topics:  # under /<robot name>/
  cmd_vel: geometry_msgs/Twist (differential drive, linear.x and angular.z)
  odom: nav_msgs/Odometry
  pose: geometry_msgs/PoseStamped (world frame "map")
  scan: sensor_msgs/LaserScan (270 degrees, 20 m)
  handler/command: std_msgs/String
  handler/state: std_msgs/String (JSON, latched)
picker:
  max_speed: 1.2
  footprint: {length: 1.78, width: 0.9}
  storage_slots: 4
  shelf_levels_5: [0.102, 0.552, 1.002, 1.452, 1.902]  # zones A and B
  shelf_levels_4: [0.102, 0.682, 1.262, 1.842]  # zones C and D
  commands:
    - "lift <z>"                tray top to height z
    - "pick <left|right>"       box beside the tray (drive so it is level with the tray, lift to its shelf)
    - "store [slot]"            tray box into a storage slot (default: first free)
    - "retrieve <slot>"         slot box onto the tray
    - "place <left|right> [y]"  push the tray box out to y m from the centre line (default: shelf)
transport:
  max_speed: 1.5
  footprint: {length: 1.3, width: 0.8}
  deck_top: 0.64
  commands:
    - "unload <front|back>"     roll every deck box off that end
  note: boxes placed on the deck are fixed to it automatically
conveyor_unload_pose: {x: -1.340, y: 24.475, yaw: 1.571}  # transport front at the belt start, then "unload front"
