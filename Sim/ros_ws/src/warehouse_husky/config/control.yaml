# Husky controllers for the warehouse simulation.
# Same as husky_control/config/control.yaml, except:
#   update_rate 10 -> 50 Hz  (smoother control for Nav2)
#   enable_odom_tf false     (odom -> base_link comes from our EKF, config/ekf.yaml)
#   wheel_separation_multiplier 1.0 -> 1.58  (skid steering: the wheels slip when turning, so wheel
#                            odometry reported 152 deg for a real 96 deg turn in Gazebo)
# '/**/' in front of the node names: they match in any namespace (the robot runs under /husky1)
/**/controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    husky_velocity_controller:
      type: diff_drive_controller/DiffDriveController

    # Only started when the robot has an arm (husky.launch.py arm:=...); the same for every arm type
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/husky_velocity_controller:
  ros__parameters:
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    wheel_separation: 0.512
    wheels_per_side: 1  # actually 2, but both are controlled by 1 signal
    wheel_radius: 0.1651

    wheel_separation_multiplier: 1.58
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    # In a namespace, the controller would otherwise name its frames husky1/odom and husky1/base_link, and
    # the EKF would ignore its odometry (each robot has its own TF tree, /husky1/tf, with plain frame names)
    tf_frame_prefix_enable: false
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: false   # the EKF (config/ekf.yaml) publishes odom -> base_link

    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    preserve_turning_radius: true
    publish_cmd: true
    publish_wheel_data: true

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -1.0

# The arm (urdf/ur_arm.urdf.xacro): follows joint trajectories, sent on the action
# /<namespace>/arm_controller/follow_joint_trajectory (scripts/arm_pose.py). It sends joint positions;
# Gazebo turns them into joint torques with the PID gains in ur_arm.urdf.xacro.
/**/arm_controller:
  ros__parameters:
    joints:
      - arm_shoulder_pan_joint
      - arm_shoulder_lift_joint
      - arm_elbow_joint
      - arm_wrist_1_joint
      - arm_wrist_2_joint
      - arm_wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 2.0
