name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
      - devvv
      - 'fet-**'
    paths:
      - 'Sim/gzScripts/Dockerfile'
      - 'requirements-test.txt'
      - 'requirements-sim.txt'
      - 'Sim/ros_ws/src/semantic_world_manager/requirements.txt'
      - '.github/workflows/build-and-push-docker-image.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (e.g., devvv, latest, or v1.0.0)'
        required: false
        default: 'devvv'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sotirusama
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: sotirusama/gzclassic
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Sim/gzScripts/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
