name: CI Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (3.10)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/Sim/ros_ws/src/semantic_world_manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            Sim/ros_ws/src/semantic_world_manager/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip check

      - name: Run mapping and semantic world manager tests
        run: |
          python -m pytest tests Sim/ros_ws/src/semantic_world_manager/test \
            -v --junitxml=test-results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14

  ros-build:
    name: ROS 2 Humble build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: sotirusama/gzclassic:devvv
      options: --user root
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ROS system dependencies
        run: |
          source /opt/ros/humble/setup.bash
          source /opt/ros2_robots/install/setup.bash
          if ! rosdep check --from-paths Sim/ros_ws/src --ignore-src --rosdistro humble \
            || ! ros2 pkg prefix tf_transformations \
            || ! ros2 pkg prefix cv_bridge; then
            apt-get -o Acquire::Retries=5 update
            rosdep update --rosdistro humble
            rosdep install --from-paths Sim/ros_ws/src --ignore-src --rosdistro humble -y
            apt-get -o Acquire::Retries=5 install -y ros-humble-tf-transformations ros-humble-cv-bridge
          fi
          rosdep check --from-paths Sim/ros_ws/src --ignore-src --rosdistro humble

      - name: Install and verify Python dependencies
        run: |
          python3 -m pip install --no-cache-dir -r requirements-test.txt -r requirements-sim.txt
          python3 -m pip check

      - name: Build ROS 2 workspace
        working-directory: Sim/ros_ws
        run: |
          source /opt/ros/humble/setup.bash
          source /opt/ros2_robots/install/setup.bash
          colcon build --symlink-install --event-handlers console_direct+

      - name: Audit installed dependencies and launch files
        run: |
          source /opt/ros/humble/setup.bash
          source /opt/ros2_robots/install/setup.bash
          source Sim/ros_ws/install/setup.bash
          python3 scripts/check_dependencies.py
          ros2 launch semantic_world_manager semantic_manager.launch.py --show-args
          ros2 launch warehouse_husky husky.launch.py --show-args
          xacro "$(ros2 pkg prefix --share husky_description)/urdf/husky.urdf.xacro" \
            is_sim:=true \
            urdf_extras:="$(ros2 pkg prefix --share warehouse_husky)/urdf/husky_lidar.urdf.xacro" \
            gazebo_controllers:="$(ros2 pkg prefix --share warehouse_husky)/config/control.yaml" \
            > /tmp/husky.urdf

      - name: Smoke test the ROS node and HTTP server
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          ROS_LOCALHOST_ONLY: '1'
        run: |
          source /opt/ros/humble/setup.bash
          source /opt/ros2_robots/install/setup.bash
          source Sim/ros_ws/install/setup.bash
          python3 -m pytest tests/test_ros_runtime.py -v --junitxml=Sim/ros_ws/log/runtime-tests.xml

      - name: Upload ROS build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ros-build-logs
          path: Sim/ros_ws/log/
          if-no-files-found: ignore
          retention-days: 14
