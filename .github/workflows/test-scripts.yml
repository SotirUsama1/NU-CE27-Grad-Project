name: Check Scripts

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Bash and Python syntax
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Check Bash syntax
        shell: bash
        run: |
          for script in Sim/gzScripts/runGzClassic-* scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: Check Python syntax
        run: python -m compileall -q scripts tests Sim/ros_ws/src
